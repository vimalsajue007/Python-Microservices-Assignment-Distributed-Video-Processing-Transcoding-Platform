[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vp-common"
version = "1.0.0"
description = "Shared library for the Distributed Video Processing & Transcoding Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "pika>=1.3.2",
    "redis>=5",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["vp_common*"]
