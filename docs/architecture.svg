<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Inter,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="s" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#17130a"/></marker>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#fffaf0"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#17130a">Distributed Video Processing &amp; Transcoding Platform — communication map</text>
  <!-- legend -->
  <line x1="30" y1="62" x2="80" y2="62" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/><text x="90" y="66" fill="#17130a">Synchronous HTTP (request/response)</text>
  <line x1="380" y1="62" x2="430" y2="62" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="440" y="66" fill="#c2410c">Asynchronous message (RabbitMQ, at-least-once)</text>
  <rect x="800" y="50" width="22" height="16" rx="4" fill="#ffc61a" stroke="#17130a"/><text x="830" y="63" fill="#17130a">service</text>
  <rect x="890" y="50" width="22" height="16" rx="4" fill="#e5e7eb" stroke="#17130a"/><text x="920" y="63" fill="#17130a">infrastructure</text>

  <!-- client + gateway -->
  <rect x="30" y="300" width="130" height="70" rx="10" fill="#fff" stroke="#17130a"/><text x="95" y="330" text-anchor="middle" font-weight="700">React UI</text><text x="95" y="350" text-anchor="middle" font-size="11">nginx :3000</text>
  <rect x="210" y="300" width="150" height="70" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="285" y="330" text-anchor="middle" font-weight="700">API Gateway</text><text x="285" y="350" text-anchor="middle" font-size="11">:8000 · validation · routing</text>
  <line x1="160" y1="335" x2="208" y2="335" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/>

  <!-- sync fan-out -->
  <rect x="470" y="100" width="170" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="555" y="127" text-anchor="middle" font-weight="700">Video Upload</text><text x="555" y="146" text-anchor="middle" font-size="11">DB: vp_upload · writes files</text>
  <rect x="470" y="200" width="170" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="555" y="227" text-anchor="middle" font-weight="700">Video Metadata</text><text x="555" y="246" text-anchor="middle" font-size="11">DB: vp_metadata · ffprobe</text>
  <rect x="470" y="300" width="170" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="555" y="327" text-anchor="middle" font-weight="700">Transcoding Orchestrator</text><text x="555" y="346" text-anchor="middle" font-size="11">DB: vp_orchestrator · retries</text>
  <rect x="470" y="400" width="170" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="555" y="427" text-anchor="middle" font-weight="700">Media Delivery</text><text x="555" y="446" text-anchor="middle" font-size="11">signed URLs · Range</text>
  <line x1="360" y1="320" x2="468" y2="132" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="360" y1="327" x2="468" y2="232" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="360" y1="335" x2="468" y2="332" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="360" y1="350" x2="468" y2="432" stroke="#17130a" stroke-width="2.5" marker-end="url(#s)"/>
  <!-- orchestrator -> metadata sync (validate video) -->
  <path d="M 640 316 C 700 300 700 250 642 240" fill="none" stroke="#17130a" stroke-width="2" marker-end="url(#s)"/><text x="668" y="284" font-size="10" fill="#17130a">video lookup</text>

  <!-- RabbitMQ -->
  <rect x="760" y="120" width="170" height="440" rx="14" fill="#e5e7eb" stroke="#17130a"/>
  <text x="845" y="148" text-anchor="middle" font-weight="700">RabbitMQ</text>
  <text x="845" y="172" text-anchor="middle" font-size="11">vp.events (topic)</text>
  <text x="845" y="192" text-anchor="middle" font-size="11">vp.jobs (direct)</text>
  <text x="845" y="212" text-anchor="middle" font-size="11">vp.retry · vp.dlx</text>
  <rect x="778" y="240" width="134" height="30" rx="6" fill="#fff" stroke="#17130a"/><text x="845" y="260" text-anchor="middle" font-size="11">metadata.events</text>
  <rect x="778" y="280" width="134" height="30" rx="6" fill="#fff" stroke="#17130a"/><text x="845" y="300" text-anchor="middle" font-size="11">thumbnail.events</text>
  <rect x="778" y="320" width="134" height="30" rx="6" fill="#fff" stroke="#17130a"/><text x="845" y="340" text-anchor="middle" font-size="11">orchestrator.events</text>
  <rect x="778" y="360" width="134" height="30" rx="6" fill="#fff" stroke="#17130a"/><text x="845" y="380" text-anchor="middle" font-size="11">transcode.jobs</text>
  <text x="845" y="420" text-anchor="middle" font-size="11">each queue has</text>
  <text x="845" y="438" text-anchor="middle" font-size="11">.retry (TTL delay) and</text>
  <text x="845" y="456" text-anchor="middle" font-size="11">.dlq (dead letters)</text>

  <!-- workers -->
  <rect x="1000" y="140" width="160" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="1080" y="167" text-anchor="middle" font-weight="700">Thumbnail Generation</text><text x="1080" y="186" text-anchor="middle" font-size="11">DB: vp_thumbnail</text>
  <rect x="1000" y="360" width="160" height="64" rx="10" fill="#ffc61a" stroke="#17130a"/><text x="1080" y="387" text-anchor="middle" font-weight="700">Transcoding Worker ×N</text><text x="1080" y="406" text-anchor="middle" font-size="11">DB: vp_transcoder · FFmpeg</text>

  <!-- async arrows -->
  <path d="M 640 125 C 710 110 720 200 776 250" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="655" y="104" font-size="11" fill="#c2410c">video.uploaded</text>
  <path d="M 912 295 C 950 290 960 190 998 178" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M 776 255 C 720 255 690 235 642 232" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M 640 345 C 700 380 740 380 776 376" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="660" y="392" font-size="11" fill="#c2410c">transcode job</text>
  <path d="M 912 376 C 950 376 960 392 998 392" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M 1000 415 C 960 470 880 520 845 335" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="930" y="505" font-size="11" fill="#c2410c">started / progress / succeeded / failed</text>
  <path d="M 778 335 C 700 520 600 520 560 366" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <path d="M 520 300 C 470 250 440 232 470 232" fill="none" stroke="none"/>
  <text x="590" y="545" font-size="11" fill="#c2410c">job.status_changed → metadata (video status)</text>

  <!-- shared infra -->
  <rect x="470" y="590" width="150" height="50" rx="10" fill="#e5e7eb" stroke="#17130a"/><text x="545" y="620" text-anchor="middle" font-weight="700">MySQL 8 (5 schemas)</text>
  <rect x="640" y="590" width="130" height="50" rx="10" fill="#e5e7eb" stroke="#17130a"/><text x="705" y="620" text-anchor="middle" font-weight="700">Redis (locks)</text>
  <rect x="790" y="590" width="190" height="50" rx="10" fill="#e5e7eb" stroke="#17130a"/><text x="885" y="620" text-anchor="middle" font-weight="700">Shared media volume</text>
  <text x="30" y="600" font-size="12" fill="#17130a">Each DB-owning service has its own schema + DB user:</text>
  <text x="30" y="620" font-size="12" fill="#17130a">no service can read or write another service's tables.</text>
  <text x="30" y="640" font-size="12" fill="#17130a">Files: upload writes, workers write, media/metadata read-only.</text>
</svg>
