[pytest]
testpaths = tests
pythonpath =
    common
    services/gateway
    services/upload
    services/metadata
    services/orchestrator
    services/transcoder
    services/thumbnail
    services/media
    tests
addopts = -ra --strict-markers
markers =
    e2e: end-to-end test against a running docker compose stack (set E2E_BASE_URL)
    ffmpeg: needs the ffmpeg binary
filterwarnings =
    ignore::DeprecationWarning
